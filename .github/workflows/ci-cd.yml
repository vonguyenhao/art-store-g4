name: PHP CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: Validate application
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: art_store_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare PHP environment
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mbstring php-mysql default-mysql-client
          php -v
          php -r "foreach (['mbstring', 'mysqli', 'pdo_mysql'] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, $extension . ' is not available' . PHP_EOL); exit(1); } echo $extension . ' is available' . PHP_EOL; }"
          mysql --version

      - name: Validate Composer file
        run: |
          if [ -f composer.json ]; then
            composer validate --strict
          else
            echo "No composer.json found; skipping Composer validation."
          fi

      - name: Install Composer dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --prefer-dist --no-progress
          else
            echo "No composer.json found; skipping dependency installation."
          fi

      - name: Lint PHP files
        run: |
          mapfile -d '' files < <(find . -name "*.php" -not -path "./vendor/*" -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found; skipping syntax lint."
            exit 0
          fi

          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Run PHPUnit tests
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo "PHPUnit is not installed yet; skipping tests."
          fi

      - name: Smoke test database schema
        run: |
          if [ -f database/schema.sql ]; then
            mysql -h 127.0.0.1 -P 3306 -uroot -proot art_store_test < database/schema.sql
          else
            echo "No database/schema.sql found; skipping schema smoke test."
          fi
